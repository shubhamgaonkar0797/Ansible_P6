
---
- name: Configure ContentSphere with Variables and Templates
  hosts: webserver
  become: true

  vars_files:
    - ../vars/contentsphere.yml

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Deploy dynamic webpage from Jinja2 template
      ansible.builtin.template:
        src: ../templates/index.html.j2
        dest: "{{ app_directory }}/index.html"
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Configure Nginx for ContentSphere
      ansible.builtin.template:
        src: ../templates/contentsphere-nginx.conf.j2
        dest: /etc/nginx/sites-available/contentsphere
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload Nginx

    - name: Enable ContentSphere Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/contentsphere
        dest: /etc/nginx/sites-enabled/contentsphere
        state: link
      notify: Validate and reload Nginx

    - name: Disable default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Validate and reload Nginx

    - name: Start and enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Validate and reload Nginx
      ansible.builtin.command: nginx -t
      changed_when: false
      notify: Reload Nginx

    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

